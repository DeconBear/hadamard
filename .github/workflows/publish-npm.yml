name: Publish npm Package

on:
  release:
    types:
      - published
  # Publish GitHub Release creates the release with GITHUB_TOKEN, which does
  # not emit a release event. Run after that workflow succeeds as well.
  workflow_run:
    workflows:
      - Publish GitHub Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate and publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'release' && !startsWith(github.event.release.tag_name || '', 'hcanvas-v')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            REF="$TAG"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            TAG="${{ github.event.workflow_run.head_branch }}"
            REF="${{ github.event.workflow_run.head_sha }}"
          else
            TAG="${{ github.event.release.tag_name }}"
            REF="$TAG"
          fi
          if [[ ! "$TAG" =~ ^v?[0-9]+[.][0-9]+[.][0-9]+([-+].*)?$ ]]; then
            echo "Tag must look like v<semver> or <semver> (got: $TAG)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="${{ steps.tag.outputs.tag }}"

          if [[ "$RELEASE_TAG" != "$PACKAGE_VERSION" && "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Release tag '$RELEASE_TAG' does not match package version '$PACKAGE_VERSION'."
            exit 1
          fi

      - name: Check whether this version already exists on npm
        id: npm_version
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Package ${PACKAGE_NAME}@${PACKAGE_VERSION} is already published."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Package ${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet."
          fi

      - name: Typecheck
        if: steps.npm_version.outputs.exists != 'true'
        run: npm run typecheck

      - name: Test
        if: steps.npm_version.outputs.exists != 'true'
        run: npm test

      - name: Build
        if: steps.npm_version.outputs.exists != 'true'
        run: npm run build

      - name: Check trusted publishing prerequisites
        if: steps.npm_version.outputs.exists != 'true'
        shell: bash
        run: |
          echo "Publishing with npm trusted publishing (OIDC)."
          echo "Expected npm trusted publisher configuration:"
          echo "  Owner/Org: DeconBear"
          echo "  Repository: hadamard"
          echo "  Workflow: publish-npm.yml"
          echo "  Environment: leave empty unless you explicitly use one"

      - name: Publish to npm
        if: steps.npm_version.outputs.exists != 'true'
        run: npm publish --access public
