name: Publish Hcanvas

# Independent Hcanvas release. Tags use hcanvas-v<version>; this workflow does
# not touch Hadamard's v* releases or installers.

on:
  push:
    tags:
      - 'hcanvas-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Hcanvas tag (hcanvas-v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-hcanvas-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^hcanvas-v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "Tag must match hcanvas-v<semver> (got: $TAG)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#hcanvas-v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify independent Hcanvas version
        shell: bash
        run: |
          EXPECTED="${{ steps.tag.outputs.version }}"
          ACTUAL="$(node -p "require('./hcanvas.version.json').version")"
          if [[ "$EXPECTED" != "$ACTUAL" ]]; then
            echo "Tag version $EXPECTED does not match hcanvas.version.json $ACTUAL"
            exit 1
          fi
          echo "Hcanvas version: $ACTUAL"

      - name: Build Hcanvas installers
        run: npm run build:hcanvas:all

      - name: Ensure GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh api "repos/${{ github.repository }}/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --title "Hcanvas $TAG" --generate-notes
          fi

      - name: Upload Hcanvas installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          gh release upload "$TAG" \
            "dist_electron/canvas/Hadamard-Canvas-Setup-${VERSION}.exe" \
            "dist_electron/canvas/Hadamard-Canvas-${VERSION}-portable.exe" \
            "dist_electron/canvas/latest.yml" \
            --repo "${{ github.repository }}" \
            --clobber
