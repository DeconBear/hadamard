name: Hcanvas E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/hcanvas/**'
      - 'tests/hcanvas-*'
      - 'scripts/verify-hcanvas-e2e.mjs'
      - 'scripts/verify-hcanvas-notebook-interactions-e2e.mjs'
      - 'scripts/verify-hcanvas-extensions-e2e.mjs'
      - 'scripts/verify-hcanvas-maxwell-e2e.mjs'
      - 'scripts/build-hcanvas-installer.mjs'
      - 'scripts/build-canvas-package.mjs'
      - 'examples/hcanvas-extensions/**'
      - 'examples/hcanvas-notebooks/**'
      - 'hcanvas.version.json'
      - 'packages/hadamard-canvas/**'
      - '.github/workflows/hcanvas-e2e.yml'
      - '.github/workflows/hcanvas-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/hcanvas-verify.yml
