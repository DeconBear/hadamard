appId: com.hadamard.canvas
productName: Hadamard Canvas
copyright: Copyright Hadamard
executableName: HadamardCanvas
directories:
  output: dist_electron/canvas
  buildResources: assets
extraMetadata:
  main: dist/src/hcanvas/electronMain.js
files:
  - dist/**/*
  - assets/hcanvas-icon.png
  - assets/hcanvas-icon.ico
  - package.json
  - node_modules/**/*
  - "!**/node_modules/electron/**"
  - "!**/node_modules/electron-builder/**"
  - "!**/node_modules/app-builder-lib/**"
  - "!**/node_modules/@electron/**"
  - "!**/node_modules/typescript/**"
  - "!**/node_modules/vitepress/**"
  - "!**/node_modules/vitest/**"
  - "!**/node_modules/tsx/**"
  - "!**/node_modules/playwright/**"
  - "!**/node_modules/@playwright/**"
  - "!**/node_modules/@types/**"
  - "!**/*.map"
  - "!dist/gui-canvas/**"
  - "!node_modules/@excalidraw/**"
asar: true
asarUnpack:
  - "**/node_modules/playwright-core/**"
npmRebuild: false
win:
  icon: assets/hcanvas-icon.ico
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
portable:
  artifactName: Hadamard-Canvas-${version}-portable.${ext}
  requestExecutionLevel: user
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Hadamard Canvas
  artifactName: Hadamard-Canvas-Setup-${version}.${ext}

linux:
  icon: assets/hcanvas-icon.png
  category: Graphics
  maintainer: Hadamard
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: Hadamard-Canvas-${version}-${arch}.${ext}

mac:
  icon: assets/hcanvas-icon.png
  category: public.app-category.graphics-design
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: Hadamard-Canvas-${version}-${arch}.${ext}
