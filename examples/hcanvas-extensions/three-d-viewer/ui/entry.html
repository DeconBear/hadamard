<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin:0; height:100%; background:#11141c; color:#e2e8f0; font:12px Inter,system-ui,sans-serif; overflow:hidden; }
  #app { position:relative; height:100%; }
  canvas { display:block; width:100%; height:100%; cursor:grab; }
  canvas.dragging { cursor:grabbing; }
  #hud { position:absolute; left:12px; top:10px; display:flex; gap:10px; align-items:center; background:rgba(20,24,34,.78); border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:6px 10px; }
  #hud strong { font-weight:600; font-size:11px; }
  #hud small { color:#9aa4b2; }
  #error { position:absolute; inset:0; display:none; place-items:center; padding:24px; text-align:center; color:#ffb4a8; font:13px/1.6 Inter,sans-serif; }
  #error.show { display:grid; }
</style></head>
<body><div id="app">
  <canvas id="scene"></canvas>
  <div id="hud"><strong id="title">3D mesh</strong><small id="meta"></small><small>drag · rotate&nbsp;&nbsp;wheel · zoom</small></div>
  <div id="error"></div>
</div>
<script>
(async () => {
  const canvas = document.getElementById('scene');
  const errorBox = document.getElementById('error');
  const meta = document.getElementById('meta');
  function fail(message) { errorBox.textContent = message; errorBox.classList.add('show'); }
  try {
    const hc = await HcanvasView.acquire();
    const file = hc.context.file;
    if (!file) throw new Error('This viewer needs an .obj file context.');
    document.getElementById('title').textContent = file.path.split('/').pop();
    const result = await hc.files.read(file.rootId, file.path);
    const mesh = parseObj(result.content);
    if (!mesh.faces.length) throw new Error('No faces found in this OBJ file.');
    meta.textContent = mesh.faces.length + ' triangles · ' + result.size + ' B';
    const gl = canvas.getContext('webgl', { antialias: true });
    if (!gl) { fail('WebGL is not available in this environment; the mesh was parsed but cannot be displayed.'); return; }
    render(gl, mesh);
  } catch (error) {
    fail(error && error.message ? error.message : String(error));
  }

  function parseObj(text) {
    const vertices = [];
    const faces = [];
    for (const line of text.split(/\r?\n/)) {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith('#')) continue;
      const parts = trimmed.split(/\s+/);
      if (parts[0] === 'v' && parts.length >= 4) {
        vertices.push(Number(parts[1]), Number(parts[2]), Number(parts[3]));
      } else if (parts[0] === 'f' && parts.length >= 4) {
        const indices = [];
        for (let i = 1; i < parts.length; i += 1) {
          const raw = parts[i].split('/')[0];
          const index = Number(raw);
          if (!Number.isFinite(index)) continue;
          indices.push(index > 0 ? index - 1 : vertices.length / 3 + index);
        }
        for (let i = 1; i + 1 < indices.length; i += 1) faces.push(indices[0], indices[i], indices[i + 1]);
      }
    }
    return { vertices, faces };
  }

  function render(gl, mesh) {
    const positions = [];
    const normals = [];
    const v = mesh.vertices;
    for (let i = 0; i < mesh.faces.length; i += 3) {
      const a = mesh.faces[i] * 3, b = mesh.faces[i + 1] * 3, c = mesh.faces[i + 2] * 3;
      const ax = v[a], ay = v[a + 1], az = v[a + 2];
      const bx = v[b], by = v[b + 1], bz = v[b + 2];
      const cx = v[c], cy = v[c + 1], cz = v[c + 2];
      const ux = bx - ax, uy = by - ay, uz = bz - az;
      const wx = cx - ax, wy = cy - ay, wz = cz - az;
      let nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
      const len = Math.hypot(nx, ny, nz) || 1;
      nx /= len; ny /= len; nz /= len;
      positions.push(ax, ay, az, bx, by, bz, cx, cy, cz);
      normals.push(nx, ny, nz, nx, ny, nz, nx, ny, nz);
    }
    // Center and normalize to a unit box.
    let minX = Infinity, minY = Infinity, minZ = Infinity, maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
    for (let i = 0; i < positions.length; i += 3) {
      minX = Math.min(minX, positions[i]); maxX = Math.max(maxX, positions[i]);
      minY = Math.min(minY, positions[i + 1]); maxY = Math.max(maxY, positions[i + 1]);
      minZ = Math.min(minZ, positions[i + 2]); maxZ = Math.max(maxZ, positions[i + 2]);
    }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, cz = (minZ + maxZ) / 2;
    const scale = 2 / (Math.max(maxX - minX, maxY - minY, maxZ - minZ) || 1);
    for (let i = 0; i < positions.length; i += 3) {
      positions[i] = (positions[i] - cx) * scale;
      positions[i + 1] = (positions[i + 1] - cy) * scale;
      positions[i + 2] = (positions[i + 2] - cz) * scale;
    }

    const vertexShader = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vertexShader, 'attribute vec3 aPos; attribute vec3 aNormal; uniform mat4 uModel; uniform mat4 uView; varying vec3 vNormal; void main(){ vNormal = mat3(uModel) * aNormal; gl_Position = uView * uModel * vec4(aPos,1.0); }');
    gl.compileShader(vertexShader);
    const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fragmentShader, 'precision mediump float; varying vec3 vNormal; uniform vec3 uColor; void main(){ vec3 n = normalize(vNormal); float light = 0.35 + 0.65 * max(dot(n, normalize(vec3(0.35,0.6,0.75))), 0.0); gl_FragColor = vec4(uColor * light, 1.0); }');
    gl.compileShader(fragmentShader);
    const program = gl.createProgram();
    gl.attachShader(program, vertexShader);
    gl.attachShader(program, fragmentShader);
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) { fail('Shader program failed to link.'); return; }
    gl.useProgram(program);

    const posBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);
    const posLoc = gl.getAttribLocation(program, 'aPos');
    gl.enableVertexAttribArray(posLoc);
    gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    const normalBuffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(normals), gl.STATIC_DRAW);
    const normalLoc = gl.getAttribLocation(program, 'aNormal');
    gl.enableVertexAttribArray(normalLoc);
    gl.vertexAttribPointer(normalLoc, 3, gl.FLOAT, false, 0, 0);
    const modelLoc = gl.getUniformLocation(program, 'uModel');
    const viewLoc = gl.getUniformLocation(program, 'uView');
    const colorLoc = gl.getUniformLocation(program, 'uColor');
    gl.uniform3f(colorLoc, 0.52, 0.66, 0.92);

    let yaw = -0.6, pitch = 0.35, distance = 3.2;
    let dragging = false, lastX = 0, lastY = 0;
    canvas.addEventListener('pointerdown', event => { dragging = true; lastX = event.clientX; lastY = event.clientY; canvas.classList.add('dragging'); canvas.setPointerCapture(event.pointerId); });
    canvas.addEventListener('pointermove', event => {
      if (!dragging) return;
      yaw += (event.clientX - lastX) * 0.01;
      pitch = Math.max(-1.5, Math.min(1.5, pitch + (event.clientY - lastY) * 0.01));
      lastX = event.clientX; lastY = event.clientY;
    });
    canvas.addEventListener('pointerup', () => { dragging = false; canvas.classList.remove('dragging'); });
    canvas.addEventListener('wheel', event => { event.preventDefault(); distance = Math.max(1.2, Math.min(8, distance + event.deltaY * 0.002)); }, { passive: false });
    window.addEventListener('resize', resize);

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(canvas.clientWidth * dpr);
      canvas.height = Math.floor(canvas.clientHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
    }
    resize();

    const start = performance.now();
    function frame() {
      const t = (performance.now() - start) / 2600;
      const cy = Math.cos(yaw + t * 0.35), sy = Math.sin(yaw + t * 0.35);
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      const rotateY = [cy, 0, sy, 0, 0, 1, 0, 0, -sy, 0, cy, 0, 0, 0, 0, 1];
      const rotateX = [1, 0, 0, 0, 0, cp, -sp, 0, 0, sp, cp, 0, 0, 0, 0, 1];
      const model = multiply(rotateX, rotateY);
      const aspect = canvas.width / Math.max(1, canvas.height);
      const f = 1 / Math.tan(0.62 / 2);
      const view = [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (2.2) / (0.1 - 20), -1, 0, 0, (0.2 * 20) / (0.1 - 20), 0];
      // Simpler perspective: scale by 1/distance after model transform.
      const scaled = model.map((value, index) => index % 4 === 3 ? value : value);
      gl.useProgram(program);
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
      gl.enableVertexAttribArray(posLoc);
      gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
      gl.enableVertexAttribArray(normalLoc);
      gl.vertexAttribPointer(normalLoc, 3, gl.FLOAT, false, 0, 0);
      gl.uniformMatrix4fv(modelLoc, false, new Float32Array(model));
      gl.uniformMatrix4fv(viewLoc, false, new Float32Array([f / aspect / distance, 0, 0, 0, 0, f / distance, 0, 0, 0, 0, -1.02, -1, 0, 0, 0, 0]));
      gl.uniform3f(colorLoc, 0.52, 0.66, 0.92);
      gl.clearColor(0.07, 0.08, 0.11, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.enable(gl.DEPTH_TEST);
      gl.drawArrays(gl.TRIANGLES, 0, positions.length / 3);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    function multiply(a, b) {
      const out = new Array(16).fill(0);
      for (let row = 0; row < 4; row += 1) for (let col = 0; col < 4; col += 1) {
        let sum = 0;
        for (let k = 0; k < 4; k += 1) sum += a[k * 4 + col] * b[row * 4 + k];
        out[row * 4 + col] = sum;
      }
      return out;
    }
  }
})();
</script></body></html>
