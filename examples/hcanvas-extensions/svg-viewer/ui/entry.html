<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #faf8f3; }
  #app { height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; overflow: auto; }
  img { max-width: 100%; max-height: 100%; object-fit: contain; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .error { color: #b42318; font: 13px/1.5 Inter, sans-serif; white-space: pre-wrap; }
  .meta { position: fixed; left: 12px; bottom: 10px; color: #8a8276; font: 10px/1.4 Inter, sans-serif; }
</style></head>
<body><div id="app">Loading…</div><div class="meta" id="meta"></div>
<script>
(async () => {
  const app = document.getElementById('app');
  try {
    const hc = await HcanvasView.acquire();
    const file = hc.context.file;
    if (!file) throw new Error('SVG viewer needs a file context.');
    const result = await hc.files.read(file.rootId, file.path);
    const blob = new Blob([result.content], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const img = document.createElement('img');
    img.alt = file.path;
    img.onload = () => { app.textContent = ''; app.appendChild(img); URL.revokeObjectURL(url); };
    img.onerror = () => { app.innerHTML = '<div class="error">Could not render this SVG.</div>'; };
    img.src = url;
    document.getElementById('meta').textContent = file.path + ' · ' + result.size + ' B';
  } catch (error) {
    app.innerHTML = '<div class="error"></div>';
    app.querySelector('.error').textContent = error && error.message ? error.message : String(error);
  }
})();
</script></body></html>
